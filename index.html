<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="color-scheme" content="dark" />
<meta name="theme-color" content="#161d2e" />
<title>Gia Phả Tông Môn — Quản lý huyết mạch</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 32 32%22><text y=%2224%22 font-size=%2224%22>🌳</text></svg>" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Noto+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app" id="app">
    <header class="topbar">
      <button type="button" class="topbar__menu" id="btn-menu"
              aria-label="Mở bảng điều khiển" aria-controls="sidebar" aria-expanded="false">
        <span aria-hidden="true">☰</span>
      </button>
      <div class="topbar__brand">
        <span class="topbar__logo" aria-hidden="true">🌳</span>
        <div>
          <h1 class="topbar__title">Gia Phả Tông Môn</h1>
          <p class="topbar__subtitle" id="active-family-label">—</p>
        </div>
      </div>
      <div class="topbar__actions">
        <button type="button" class="btn btn--ghost btn--dual" id="btn-import" title="Import JSON" aria-label="Import JSON">
          <span class="btn__glyph" aria-hidden="true">⤓</span><span class="btn__label">Import JSON</span>
        </button>
        <button type="button" class="btn btn--ghost btn--dual" id="btn-export" title="Export JSON" aria-label="Export JSON">
          <span class="btn__glyph" aria-hidden="true">⤒</span><span class="btn__label">Export JSON</span>
        </button>
        <input type="file" id="file-input" accept="application/json" hidden />
      </div>
    </header>

    <div class="layout">
      <div class="sidebar-scrim" id="sidebar-scrim" hidden></div>
      <aside class="sidebar" id="sidebar">
        <div class="sidebar__drawer-head">
          <span class="sidebar__drawer-title">Bảng điều khiển</span>
          <button type="button" class="sidebar__drawer-close" id="btn-sidebar-close" aria-label="Đóng bảng điều khiển">×</button>
        </div>

        <div class="sidebar__section">
          <div class="sidebar__head">
            <h2 class="sidebar__title">Gia phả</h2>
            <button type="button" class="btn btn--soft btn--sm" id="btn-new-family">+ Gia phả</button>
          </div>
          <ul class="family-list" id="family-list"></ul>
        </div>

        <div class="sidebar__section">
          <div class="sidebar__head">
            <h2 class="sidebar__title">Cây huyết thống</h2>
            <button type="button" class="btn btn--soft btn--sm" id="btn-new-tree">+ Cây</button>
          </div>
          <ul class="family-list" id="tree-list"></ul>
        </div>

        <div class="sidebar__section sidebar__section--grow">
          <div class="sidebar__head">
            <h2 class="sidebar__title">Cảnh giới</h2>
          </div>
          <div class="realm-tree" id="realm-tree"></div>
        </div>

        <div class="sidebar__section">
          <p class="sidebar__hint">
            Dữ liệu tự lưu vào trình duyệt (localStorage). Dùng Export JSON để sao lưu ra file.
          </p>
        </div>
      </aside>

      <main class="stage">
        <div class="toolbar">
          <div class="toolbar__group">
            <button type="button" class="btn btn--icon" id="btn-zoom-out" title="Thu nhỏ">−</button>
            <span class="toolbar__zoom" id="zoom-label">100%</span>
            <button type="button" class="btn btn--icon" id="btn-zoom-in" title="Phóng to">+</button>
            <button type="button" class="btn btn--ghost btn--sm" id="btn-zoom-reset">Reset zoom</button>
            <button type="button" class="btn btn--ghost btn--sm" id="btn-fit">Fit vừa màn hình</button>
          </div>
          <div class="toolbar__legend">
            <span class="legend-item"><i class="legend-swatch legend-swatch--male"></i>Nam</span>
            <span class="legend-item"><i class="legend-swatch legend-swatch--female"></i>Nữ</span>
            <span class="legend-item"><i class="legend-swatch legend-swatch--unknown"></i>Không xác định</span>
            <span class="legend-item"><i class="legend-swatch legend-swatch--divider"></i>Ranh giới cây huyết thống</span>
          </div>
        </div>

        <div class="canvas" id="canvas">
          <div class="canvas__viewport" id="viewport">
            <div class="canvas__lanes" id="lane-layer"></div>
            <svg class="canvas__links" id="link-layer"></svg>
            <div class="canvas__nodes" id="node-layer"></div>
          </div>
          <div class="canvas__empty" id="empty-state" hidden>
            <p>Gia phả này chưa có nhân vật nào.</p>
          </div>
          <div class="canvas__controls" aria-label="Điều khiển khung nhìn">
            <button type="button" class="fab" id="btn-fit-m" title="Fit vừa màn hình" aria-label="Fit vừa màn hình">⤢</button>
            <button type="button" class="fab" id="btn-zoom-in-m" title="Phóng to" aria-label="Phóng to">+</button>
            <span class="fab fab--label" id="zoom-label-m" aria-hidden="true">100%</span>
            <button type="button" class="fab" id="btn-zoom-out-m" title="Thu nhỏ" aria-label="Thu nhỏ">−</button>
          </div>
        </div>
      </main>
    </div>
  </div>

  <div id="modal-root"></div>
  <div id="toast-root" class="toast-root" aria-live="polite"></div>

  <script src="js/seed.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/store.js"></script>
  <script src="js/layout.js"></script>
  <script src="js/tree.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/lane-modal.js"></script>
  <script src="js/character-modal.js"></script>
  <script src="js/sidebar.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
